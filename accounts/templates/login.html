{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - AirVision</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(800px 500px at 20% -10%, #dbeafe 0%, transparent 55%),
                  radial-gradient(800px 500px at 100% 5%, #e0e7ff 0%, transparent 50%),
                  #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      width: 380px;
      max-width: 100%;
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      padding: 36px 32px 32px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 6px;
      cursor: text;
    }
    .brand-bars { display: flex; align-items: flex-end; gap: 3px; }
    .brand-bars span {
      display: block;
      width: 5px;
      border-radius: 3px;
    }
    .brand-bars span:nth-child(1) { height: 14px; background: #bfdbfe; }
    .brand-bars span:nth-child(2) { height: 20px; background: #93c5fd; }
    .brand-bars span:nth-child(3) { height: 28px; background: #2563eb; }
    .brand-text {
      font-weight: 800;
      font-size: 22px;
      color: #0f172a;
    }
    .login-subtitle {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 28px;
    }
    .form-floating-custom {
      margin-bottom: 16px;
    }
    .form-floating-custom label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-floating-custom .input-wrap {
      position: relative;
    }
    .form-floating-custom .input-wrap .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 16px;
      pointer-events: none;
    }
    .form-floating-custom .input-wrap .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #94a3b8;
      font-size: 16px;
      user-select: none;
    }
    .form-floating-custom .input-wrap .toggle-pass:hover { color: #64748b; }
    .form-floating-custom input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      font-size: 14px;
      color: #1f2d3d;
      outline: none;
      transition: all 0.2s;
      background: #f8fafc;
    }
    .form-floating-custom input:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .form-floating-custom input::placeholder {
      color: #cbd5e1;
    }
    .btn-login {
      width: 100%;
      padding: 11px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-login:hover { background: #1d4ed8; }
    .login-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #64748b;
    }
    .login-footer a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .login-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="brand-wrap">
    <div class="brand-bars">
      <span></span><span></span><span></span>
    </div>
    <span class="brand-text">AirVision</span>
  </div>
  <p class="login-subtitle">Sign in to your account</p>

  <form method="POST">
    {% csrf_token %}
    <div class="form-floating-custom">
      <label><i class="bi bi-person me-1"></i>Username</label>
      <div class="input-wrap">
        <i class="bi bi-person input-icon"></i>
        <input type="text" name="username" placeholder="Enter your username" required>
      </div>
    </div>
    <div class="form-floating-custom">
      <label><i class="bi bi-lock me-1"></i>Password</label>
      <div class="input-wrap">
        <i class="bi bi-lock input-icon"></i>
        <input type="password" name="password" id="loginPassword" placeholder="Enter your password" required>
        <span class="toggle-pass" onclick="togglePassword()">
          <i class="bi bi-eye-slash" id="eyeIcon"></i>
        </span>
      </div>
    </div>
    <button class="btn-login" type="submit">
       Login
    </button>
  </form>

  <p class="login-footer">
    Don't have an account? <a href="{% url 'register' %}">Register</a>
  </p>
</div>
<script>
  function togglePassword() {
    var p = document.getElementById('loginPassword');
    var e = document.getElementById('eyeIcon');
    if (p.type === 'password') {
      p.type = 'text';
      e.className = 'bi bi-eye';
    } else {
      p.type = 'password';
      e.className = 'bi bi-eye-slash';
    }
  }
</script>
</body>
</html>
