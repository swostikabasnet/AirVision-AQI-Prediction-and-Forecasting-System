{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
              background: #f4f7fb;
              font-family: Arial;
            }

        .login-box{
                    width: 350px;
                    margin: 100px auto;
                    background: white;
                    padding: 30px;
                    border-radius: 10px;
                    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
                    text-align: center;
                  }

        .logo{
                height: 40px;
              }
    </style>
  </head>

<body>

<div class="login-box">

  <div class="mb-4 text-center">

    <!-- Logo + AirVision -->
    <div class="d-flex justify-content-center align-items-end gap-1 mb-2">

      <span style="display:block;width:6px;height:14px;border-radius:3px;background:#bfdbfe;"></span>

      <span style="display:block;width:6px;height:20px;border-radius:3px;background:#93c5fd;"></span>

      <span style="display:block;width:6px;height:28px;border-radius:3px;background:#2563eb;"></span>

      <span style="font-weight:700; color:#1f2d3d; font-size:20px;">
        AirVision
      </span>

    </div>

  </div>
    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" class="form-control mt-3" required>

        <input type="password" name="password" placeholder="Password" class="form-control mt-3" required>

        <button class="btn btn-primary w-100 mt-4">Login</button>
    </form>

    <p class="mt-3" style="color:#64748b;">
        Don't have an account? 
        <a href="{% url 'register' %}">Register</a>
    </p>

</div>

</body>
</html>
