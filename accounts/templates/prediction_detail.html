{% load tz %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Report - AirVision</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #f1f5f9; font-family: system-ui, -apple-system, sans-serif; padding: 32px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .report-card { max-width: 720px; width: 100%; margin: auto; background: #fff; border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 24px rgba(0,0,0,0.06); overflow: hidden; }
        .report-body { padding: 28px; }
        .report-image { width: 100%; max-height: 340px; object-fit: cover; border-radius: 14px; margin-bottom: 24px; border: 1px solid #e2e8f0; display: block; }
        .aqi-score { font-size: 56px; font-weight: 800; line-height: 1; }
        .aqi-label { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        .aqi-good { color: #16a34a; }
        .aqi-moderate { color: #d97706; }
        .aqi-unhealthy { color: #dc2626; }
        .status-badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 16px; border-radius: 100px; font-size: 13px; font-weight: 600; }
        .status-good { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
        .status-moderate { background: #fffbeb; color: #d97706; border: 1px solid #fde68a; }
        .status-unhealthy { background: #fff1f2; color: #dc2626; border: 1px solid #fecdd3; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
        .info-item { background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #f1f5f9; }
        .info-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
        .info-value { font-size: 15px; font-weight: 600; color: #1f2d3d; }
        .health-box { border-radius: 12px; padding: 16px; margin-top: 16px; display: flex; gap: 12px; align-items: flex-start; }
        .health-good { background: #f0fdf4; border: 1px solid #bbf7d0; }
        .health-good i { color: #16a34a; }
        .health-good .health-title { color: #166534; }
        .health-good .health-text { color: #15803d; }
        .health-moderate { background: #fffbeb; border: 1px solid #fde68a; }
        .health-moderate i { color: #d97706; }
        .health-moderate .health-title { color: #92400e; }
        .health-moderate .health-text { color: #a16207; }
        .health-unhealthy { background: #fff1f2; border: 1px solid #fecdd3; }
        .health-unhealthy i { color: #dc2626; }
        .health-unhealthy .health-title { color: #991b1b; }
        .health-unhealthy .health-text { color: #b91c1c; }
        .btn-dashboard { display: inline-flex; align-items: center; gap: 8px; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; background: #2563eb; color: #fff; text-decoration: none; transition: background 0.15s; border: none; cursor: pointer; }
        .btn-dashboard:hover { background: #1d4ed8; color: #fff; }
        .btn-dashboard i { font-size: 16px; }
        .divider { height: 1px; background: #e2e8f0; margin: 20px 0; }
    </style>
</head>
<body>
<div class="report-card">
    <div class="report-body">
        {% if prediction.image %}
        <img src="{{ prediction.image.url }}" alt="Sky image" class="report-image">
        {% endif %}

        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
            <div>
                <div class="aqi-score aqi-{{ status_class }}">{{ prediction.predicted_aqi }}</div>
                <div class="aqi-label">AQI Score</div>
            </div>
            <span class="status-badge-pill status-{{ status_class }}">
                <i class="bi bi{% if status_class == 'good' %}-check-circle{% elif status_class == 'moderate' %}-exclamation-circle{% else %}-x-circle{% endif %}"></i>
                {{ prediction.status }}
            </span>
        </div>

        <div class="info-grid">
        </div>

        {% if advice %}
        <div class="health-box health-{{ status_class }}">
            <i class="bi bi-{% if status_class == 'unhealthy' %}exclamation-triangle-fill{% elif status_class == 'moderate' %}exclamation-circle-fill{% else %}check-circle-fill{% endif %}"></i>
            <div>
                <div class="health-title" style="font-size:13px;font-weight:700;margin-bottom:2px;">Health Advice</div>
                <div class="health-text" style="font-size:13px;line-height:1.6;">{{ advice }}</div>
            </div>
        </div>
        {% endif %}

        <div class="divider"></div>

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
            {% if user_is_admin %}
            <a href="/myadmin/" class="btn-dashboard">Back to Dashboard</a>
            {% else %}
            <a href="/user/" class="btn-dashboard">Back to Dashboard</a>
            {% endif %}
        </div>
    </div>
</div>
</body>
</html>
