<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <!-- Include Bootstrap from CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <div class="text-center mb-3">
                    <div style="display:flex; align-items:flex-end; justify-content:center; gap:4px; margin-bottom:10px;">
                      <span style="display:block;width:6px;height:14px;border-radius:3px;background:#bfdbfe;"></span>
                      <span style="display:block;width:6px;height:20px;border-radius:3px;background:#93c5fd;"></span>
                      <span style="display:block;width:6px;height:28px;border-radius:3px;background:#2563eb;"></span>
                      <span style="font-weight:700; color:#1f2d3d; font-size:20px;">AirVision</span>
                    </div>
                    <h4 class="mb-2">Create an account</h4>
                    
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>
                </form>

                <p class="mt-3 text-center" style="color:#64748b;">
                    Already have an account?
                    <a href="{% url 'login' %}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
