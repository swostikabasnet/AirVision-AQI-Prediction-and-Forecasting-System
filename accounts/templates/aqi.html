{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirVision - {{ city }} AQI</title>
    <meta name="description" content="Current AQI and forecast for {{ city }}.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --av-bg-1: #eef2ff;
            --av-bg-2: #f8fafc;
            --av-border: #e2e8f0;
            --av-primary: #2563eb;
            --av-ink: #1f2937;
            --av-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(900px 500px at 12% -10%, #dbeafe 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #e0e7ff 0%, transparent 50%),
                #f1f5f9;
            min-height: 100vh;
        }

        /* ---------- Navbar ---------- */
        .search-box { position: relative; width: 240px; }
        .search-box input {
            width: 100%;
            padding: 8px 36px 8px 14px;
            border-radius: 22px;
            border: 1px solid #e2e8f0;
            outline: none;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-box input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
        }
        .search-icon {
            position: absolute; right: 11px; top: 50%;
            transform: translateY(-50%);
            color: #94a3b8; background: none;
            border: none; padding: 0; cursor: pointer; font-size: 14px;
        }

        /* ---------- main card ---------- */
        .aqi-main-card {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 28px;
            box-shadow: 0 24px 60px -20px rgba(30, 64, 175, 0.30);
        }

        /* ---------- Big circular indicator (main focus) ---------- */
        .aqi-circle-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .aqi-circle {
            position: relative;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            box-shadow:
                0 0 0 14px rgba(37, 99, 235, 0.08),
                0 18px 40px -12px rgba(37, 99, 235, 0.45);
        }

        .aqi-circle-label {
            font-size: 12px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--av-muted);
            font-weight: 600;
        }
        .aqi-circle-value {
            font-size: 64px;
            line-height: 1;
            font-weight: 800;
            color: var(--av-primary);
            margin: 4px 0 2px;
        }
        .aqi-circle-unit {
            font-size: 12px;
            color: var(--av-muted);
            font-weight: 600;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 15px;
        }
        .status-pill .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: currentColor;
        }
        .status-badge 
      { display: inline-block; 
        font-size: 13px; 
        font-weight: 600; 
        padding: 4px 14px; 
        border-radius: 20px; 
        margin-bottom: 18px; 
      }
      .status-good 
      { color: #16a34a; 
        background: #f0fdf4; 
        border: 1px solid #bbf7d0; 
      }
      .status-moderate 
      { color: #d97706; 
        background: #fffbeb; 
        border: 1px solid #fde68a; 
      }
      .status-unhealthy 
      { color: #dc2626; 
        background: #fff1f2; 
        border: 1px solid #fecdd3; 
      }
      .aqi-good 
      { color: #16a34a;
      }
      .aqi-moderate 
      { color: #d97706; 
      }
      .aqi-unhealthy 
      { color: #dc2626; 
      }
        /* ---------- Info boxes ---------- */
        .info-box {
            background: rgba(248, 250, 252, 0.85);
            border: 1px solid var(--av-border);
            border-radius: 18px;
            padding: 16px 18px;
            height: 100%;
        }
        .info-label {
            font-size: 11px;
            color: var(--av-muted);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .info-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--av-ink);
        }
        .recommendation-box {
            border-radius: 18px;
            padding: 18px 20px;
        }
        .recommendation-good {
            background: rgba(220, 252, 231, 0.7);
            border: 1px solid #bbf7d0;
        }
        .recommendation-moderate {
            background: rgba(254, 249, 195, 0.7);
            border: 1px solid #fde68a;
        }
        .recommendation-unhealthy {
            background: rgba(254, 226, 226, 0.7);
            border: 1px solid #fecaca;
        }

        
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background:rgba(255,255,255,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--av-border);">
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <a class="navbar-brand d-flex align-items-center" href="/" style="color:#1f2d3d; font-weight:700;">
      <div style="display:flex; align-items:flex-end; gap:3px; margin-right:10px;">
        <span style="display:block;width:5px;height:14px;border-radius:3px;background:#bfdbfe;"></span>
        <span style="display:block;width:5px;height:20px;border-radius:3px;background:#93c5fd;"></span>
        <span style="display:block;width:5px;height:28px;border-radius:3px;background:#2563eb;"></span>
      </div>
      AirVision
    </a>
    <div class="d-flex align-items-center gap-3">
        <form method="GET" action="/search/" class="search-box d-none d-md-flex" style="margin:0;">
            <input name="city" list="districts" type="text" placeholder="Search district...">
            <datalist id="districts">
                {% for card in city_cards %}
                <option value="{{ card.city }}"></option>
                {% endfor %}
            </datalist>
            <button type="submit" class="search-icon"><i class="bi bi-search"></i></button>
        </form>
        
    </div>
    
  </div>
</nav>

<div class="container py-5">

    <!-- Page header -->
    <div class="text-center mb-5">
        <h1 class="mb-2 fw-bold">{{ city }} Air Quality</h1>
    </div>

    <!-- Main card -->
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">
            <div class="aqi-main-card p-4 p-md-5">
                <div class="row g-4 align-items-center">

                    <!-- Circular indicator: for AQI -->
                    <div class="col-md-5">
                        <div class="aqi-circle-wrap mb-3 mb-md-0">
                            <div class="aqi-circle aqi-{{ status_class }}">
                                <span class="aqi-circle-label">Current AQI</span>
                                <span class="aqi-circle-value">{{ aqi }}</span>
                            
                            </div>
                        </div>
                       
                        
                    </div>

                    <!-- Key metrics + advice -->
                    <div class="col-md-7">
                        <div class="row g-3">
                            <div class="col-5">
                                <div class="info-box">
                                    <div class="info-label">AQI Score</div>
                                    <div class="info-value">{{ aqi }}</div>
                                </div>
                            </div>
                            <div class="col-7">
                                <div class="info-box">
                                    <div class="info-label">PM2.5 Concentration</div>
                                    <div class="info-value">{{ pm25 }} µg/m³</small></div>
                                </div>
                            </div>
                            
                        </div>

                        <div class="recommendation-box recommendation-{{ status_class }} mt-3">
                            <div class="info-label mb-2">
                                 <i class="bi bi-{% if status_class == 'good' %}check-circle-fill text-success{% elif status_class == 'moderate' %}exclamation-circle-fill text-warning{% else %}exclamation-triangle-fill text-danger{% endif %} me-1"></i>Health Recommendation</div>
                            <p class="mb-0 text-secondary" style="line-height:1.55; font-size:12px;">{{ advice }}</p>
                        </div>

                        <div class="mt-4 d-grid d-sm-block">
                            <a href="/forecast/{{ city|lower }}/" class="btn btn-primary  rounded-3">
                                View 7 Day Forecast
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
